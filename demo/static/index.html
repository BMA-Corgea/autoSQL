<!--
  demo/static/index.html — the demo's one page.

  STYLESHEET ORDER, AND WHY IT IS THIS WAY ROUND
    The four vendored Watery sheets first, byte-identical, then this
    demo's own. Locate §3.1 fixes that order and the cascade needs it:
    shell.css:48 has a `.rail` of its own (GIMS's sticky 100vh workspace
    navigator) and the mock uses `.rail` for the four-stop enforcement
    strip, so demo.css has to come last to win.

    D11 says demo.css is loaded "before watery.css" so its self-hosted
    Inter beats watery.css:8's Google-Fonts @import, which offline is a
    silent no-op. That still happens here: @font-face rules are collected
    regardless of order, and an @import is hoisted to the top of its own
    sheet — so watery's remote Inter is registered FIRST and this file's
    local one wins either way. D11's purpose is kept; its ordering
    sentence is not the mechanism that delivers it.

  NOTHING IS FETCHED FROM ANOTHER HOST. AC-32 requires the suite to pass
  with no network beyond pulling the Postgres image, and a screen that
  only looks right online is a screen that is wrong.

  THE TWO BUNDLES ARE COMMITTED (B19, AC-36). No build step runs here; a
  clone with `node` removed from PATH serves this page exactly as built.
-->
