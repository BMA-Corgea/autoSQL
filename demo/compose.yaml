# demo/compose.yaml — the demo's own Postgres, and nothing else's.
#
# T-2-plan.md W4 (§11.2, B21, B23). This file is the whole of what the demo
# knows about its database: one container, one host port, one volume, one
# role that owns nothing but invented data.
#
# ── Isolation, stated once here because everything else in the demo tree
#    depends on it being true ──────────────────────────────────────────────
#   Host port 55440, bound to 127.0.0.1 only — never 0.0.0.0, never any other
#   port. This is deliberately NOT the port the T-1 spike borrowed: a live
#   database on this machine, holding real data, that this project must
#   never touch (spec §11.2 names it; that name and its port are exactly
#   what AC-3's grep forbids anywhere in this tree, so neither is repeated
#   here — a copy-paste of the wrong port number does not survive that
#   test either way).
#
#   POSTGRES_INITDB_ARGS pins the C collation at cluster-init time, so text
#   sorts in byte order and matches Python's code-point comparison — §7.4's
#   comparator explains why an inherited locale (e.g. en_US.UTF-8) would
#   silently produce a different sort order for the same rows on a different
#   machine. This is the one place that setting is made, for every statement
#   the demo ever runs.
#
#   The role/database password below is committed in plain text. That is
#   safe here specifically because this role (autosql_demo) owns nothing but
#   this container's own invented rows — the exact opposite of the role that
#   owns the live database above, whose password stays out of git for
#   exactly the reason this one does not need to.
#
# ── What this file is not ───────────────────────────────────────────────
#   It declares no readiness wait of its own beyond the container's internal
#   HEALTHCHECK below. `./run-demo up` does the real wait: a Python poll
#   through the driver every 250 milliseconds up to 60 seconds (B21) — because this machine has
#   no `psql` / `pg_isready` on the HOST, and because a failed compose
#   HEALTHCHECK (which runs *inside* the image) tells the host nothing about
#   why. Nothing in `./run-demo` shells out to a Postgres client binary; the
#   HEALTHCHECK below is declarative only and is never depended on by any
#   script in this tree.

name: autosql-demo

services:
  db:
    image: postgres:16-alpine
    container_name: autosql-demo-db
    restart: "no"
    environment:
      POSTGRES_USER: autosql_demo
      POSTGRES_PASSWORD: autosql_demo_password
      POSTGRES_DB: autosql_demo
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - autosql-demo-db-data:/var/lib/postgresql/data
    healthcheck:
      # Informational only — see the note above. Runs pg_isready INSIDE the
      # image, which ships it; the host still has neither pg_isready nor
      # psql, and ./run-demo's own wait never reads this field.
      test: ["CMD-SHELL", "pg_isready -U autosql_demo -d autosql_demo"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  autosql-demo-db-data:
    name: autosql-demo-db-data
